<h1 class="job-heading">Available Jobs</h1>

<div class="job-list">
    {% for job in jobs %}
        <div class="job-card">
            <h2 class="job-title">{{ job.job_title }}</h2>
            <p class="job-description">{{ job.description }}</p>
            <a href="{% url 'apply_for_job' job.id %}" class="apply-button">Apply Now</a>
        </div>
    {% empty %}
        <p class="no-jobs">No jobs available at the moment.</p>
    {% endfor %}
</div>

<style>
    /* Global Styles */
    body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f6f9;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    /* Heading */
    .job-heading {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
        font-size: 2em;
    }

    /* Job List Container */
    .job-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
    }

    /* Job Card */
    .job-card {
        background-color: #ffffff;
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 350px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        text-align: center;
    }

    .job-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    /* Job Title */
    .job-title {
        color: #3498db;
        font-size: 1.5em;
        margin-bottom: 10px;
    }

    /* Job Description */
    .job-description {
        font-size: 1.1em;
        color: #555;
        margin-bottom: 15px;
    }

    /* Apply Button */
    .apply-button {
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }

    .apply-button:hover {
        background-color: #2980b9;
    }

    /* No Jobs Message */
    .no-jobs {
        text-align: center;
        color: #999;
        font-size: 1.2em;
        margin-top: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .job-card {
            max-width: 100%;
        }
    }
</style>
