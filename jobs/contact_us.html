{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url("{% static 'images/contact.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 1s ease-in;
        }

        .logo {
            width: 130px;
            height:60px;
            margin-bottom: 20px;
            animation: bounceIn 1.5s ease-in-out;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideUp 1s ease-in-out;
            max-width: 900px;
            width: 90%;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .contact-info i {
            font-size: 2.5rem;
            color: #f1c40f;
            margin-right: 15px;
            transition: transform 0.3s ease-in-out;
        }

        .contact-info i:hover {
            transform: scale(1.2);
        }

        .contact-info p {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 1.2rem;
            transition: all 0.3s ease-in-out;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #6dd5fa);
            border: none;
            font-size: 1.3rem;
            padding: 14px;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #6dd5fa, #3498db);
            transform: scale(1.05);
        }

        .success-message {
            display: none;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2ecc71;
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }
    </style>
</head>
<body>
    <img src="{% static 'images/logo.png' %}" alt="Job Portal Logo" class="logo">
    <div class="container">
        <h2 class="mb-4">Contact Us</h2>
        <div class="row">
            <div class="col-md-6 contact-info">
                <div class="mb-4 d-flex align-items-center">
                    <i class="fas fa-map-marker-alt"></i>
                    <p>413101 ITSector, Akluj, India</p>
                </div>
                <div class="mb-4 d-flex align-items-center">
                    <i class="fas fa-envelope"></i>
                    <p>itsector@jobportal.com</p>
                </div>
                <div class="mb-4 d-flex align-items-center">
                    <i class="fas fa-phone"></i>
                    <p>+1 800 123 4567</p>
                </div>
            </div>
            <div class="col-md-6">
                <h3>Send Us a Message</h3>
                <form id="contact-form" action="{% url 'contact_us' %}" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" class="form-control" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" name="message" rows="4" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
                <div id="success-message" class="success-message">Your message has been sent successfully!</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("contact-form").addEventListener("submit", function(event) {
            event.preventDefault(); 
            document.getElementById("success-message").style.display = "block";
            setTimeout(() => {
                document.getElementById("success-message").style.display = "none";
            }, 3000);
        });
    </script>
</body>
</html>
